name: for-u-production

x-database-environment: &database-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
  DATABASE_SSL: "false"
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
  DATABASE_IDLE_TIMEOUT_MS: "30000"
  DATABASE_CONNECTION_TIMEOUT_MS: "5000"
  DATABASE_STATEMENT_TIMEOUT_MS: "15000"

x-runtime-environment: &runtime-environment
  <<: *database-environment
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AI_REFINEMENT_ENABLED: ${AI_REFINEMENT_ENABLED:-false}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
  RECOMMENDATION_RULES_VERSION: ${RECOMMENDATION_RULES_VERSION:-compatibility-rules-v1}
  AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-compatibility-explanation-v1}

x-server-image: &server-image
  image: for-u-server:${IMAGE_TAG:?IMAGE_TAG is required}
  build:
    context: ./server
  restart: unless-stopped
  networks: [backend]

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - for_u_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [backend]
    logging:
      options: { max-size: "10m", max-file: "3" }

  migrate:
    <<: *server-image
    command: ["npm", "run", "migrate:prod"]
    environment: *database-environment
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *server-image
    command: ["npm", "start"]
    environment:
      <<: *runtime-environment
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: "true"
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW_MS: "60000"
      BODY_LIMIT_BYTES: "262144"
      AUTH_MODE: jwt
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      JWT_JWKS_URL: ${JWT_JWKS_URL:?JWT_JWKS_URL is required}
      JWT_JWKS_FILE: /run/secrets/jwks.json
    volumes:
      - ${JWT_JWKS_HOST_FILE:?JWT_JWKS_HOST_FILE is required}:/run/secrets/jwks.json:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    stop_grace_period: 30s
    logging:
      options: { max-size: "10m", max-file: "3" }

  worker:
    <<: *server-image
    command: ["npm", "run", "worker:prod"]
    environment:
      <<: *runtime-environment
      WORKER_ID: ${WORKER_ID:-for-u-worker-1}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-1000}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-60000}
      WORKER_COMPLETION_MARGIN_MS: ${WORKER_COMPLETION_MARGIN_MS:-5000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-12000}
      OPENAI_MAX_ATTEMPTS: ${OPENAI_MAX_ATTEMPTS:-2}
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 75s
    logging:
      options: { max-size: "10m", max-file: "3" }

volumes:
  for_u_postgres_data:

networks:
  backend:
