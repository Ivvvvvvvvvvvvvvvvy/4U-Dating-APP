name: for-u-local

x-database-environment: &database-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-for_u}:${POSTGRES_PASSWORD:-for_u_local_only}@postgres:5432/${POSTGRES_DB:-for_u}
  DATABASE_SSL: "false"
  DATABASE_POOL_MAX: "10"
  DATABASE_IDLE_TIMEOUT_MS: "30000"
  DATABASE_CONNECTION_TIMEOUT_MS: "5000"
  DATABASE_STATEMENT_TIMEOUT_MS: "15000"

x-service-environment: &service-environment
  <<: *database-environment
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  AI_REFINEMENT_ENABLED: ${AI_REFINEMENT_ENABLED:-false}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
  RECOMMENDATION_RULES_VERSION: ${RECOMMENDATION_RULES_VERSION:-compatibility-rules-v1}
  AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-compatibility-explanation-v1}

x-api-environment: &api-environment
  <<: *service-environment
  AUTH_MODE: dev
  DEV_AUTH_TOKEN: ${DEV_AUTH_TOKEN:-for-u-local-development-token}
  DEV_USER_ID: ${DEV_USER_ID:-person_me}

x-worker-environment: &worker-environment
  <<: *service-environment
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-12000}
  OPENAI_MAX_ATTEMPTS: ${OPENAI_MAX_ATTEMPTS:-2}

x-server-image: &server-image
  image: for-u-server:local
  build:
    context: ./server

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-for_u}
      POSTGRES_USER: ${POSTGRES_USER:-for_u}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-for_u_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - for_u_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    <<: *server-image
    command: ["npm", "run", "migrate:prod"]
    environment:
      <<: *database-environment
      NODE_ENV: development
      AUTH_MODE: dev
      DEV_AUTH_TOKEN: ${DEV_AUTH_TOKEN:-for-u-local-development-token}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *server-image
    command: ["npm", "start"]
    environment:
      <<: *api-environment
      HOST: 0.0.0.0
      PORT: "3000"
      TRUST_PROXY: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      BODY_LIMIT_BYTES: ${BODY_LIMIT_BYTES:-262144}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    <<: *server-image
    command: ["npm", "run", "worker:prod"]
    environment:
      <<: *worker-environment
      WORKER_ID: ${WORKER_ID:-for-u-worker-local}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-1000}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-60000}
      WORKER_COMPLETION_MARGIN_MS: ${WORKER_COMPLETION_MARGIN_MS:-5000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 75s

volumes:
  for_u_postgres_data:
