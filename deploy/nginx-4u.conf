server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 81.70.186.48 _;

    location /.well-known/acme-challenge/ {
        root /var/www/4u/current;
    }

    location / {
        return 308 https://81.70.186.48$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 81.70.186.48;

    ssl_certificate /etc/letsencrypt/live/81.70.186.48/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/81.70.186.48/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/4u/current;
    index index.html;

    client_max_body_size 256k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /.well-known/jwks.json {
        alias /etc/nginx/jwks.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
